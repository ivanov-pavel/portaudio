name: Build PortAudio Static Library x64

on: [push, pull_request]

env:
  SOLUTION_FILE_PATH: ./msvc/portaudio.sln
  VCPROJ_FILE_PATH: ./msvc/portaudio.vcproj
  VCXPROJ_FILE_PATH: ./msvc/portaudio.vcxproj
  VCXPROJ_FILTERS_FILE_PATH: ./msvc/portaudio.vcxproj.filters
  VCXPROJ_USER_FILE_PATH: ./msvc/portaudio.vcxproj.user
  DEF_FILE_PATH: ./msvc/portaudio.def

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Release]
        BUILD_PLATFORM: [x64]

    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1

    - uses: actions/checkout@v2

    - name: Upgrade VC Project File
      run: |
        $devenv = & vswhere.exe '-property' productPath
        Write-Output "$devenv"
        & $devenv "${{env.VCPROJ_FILE_PATH}}" /Upgrade /NoSplash | Out-Null
        Write-Output "devenv launched"
        while (!(Test-Path "${{env.VCXPROJ_FILE_PATH}}")) { Start-Sleep -Seconds 10 }
        Write-Output "vcxproj found"
        while (!(Test-Path "${{env.VCXPROJ_FILTERS_FILE_PATH}}")) { Start-Sleep -Seconds 10 }
        Write-Output "vcxproj.filters found"
        Start-Sleep -Seconds 10
        Write-Output "done."

    - name: Remove ASIO Files and Enable PA_USE_DS=1
      run: |
        # Process .vcxproj file: remove source files
        $xdoc = new-object System.Xml.XmlDocument
        $vcxprojFile = resolve-path("${{env.VCXPROJ_FILE_PATH}}")
        $xdoc.load($vcxprojFile)
        $namespace = New-Object -TypeName "Xml.XmlNamespaceManager" -ArgumentList $xdoc.NameTable
        $namespace.AddNamespace("vs", $xdoc.DocumentElement.NamespaceURI)
        $nodes = $xdoc.SelectNodes("//vs:ClCompile[contains(@Include, '..\src\hostapi\asio')]", $namespace)
        Write-Output "deleting ASIO related compilation nodes from .vcxproj:"
        Write-Output $nodes
        ForEach($node in $nodes) {
          $parent = $node.ParentNode
          $parent.RemoveChild($node)
        }
        # Enable DirectSound host API
        $nodes = $xdoc.SelectNodes("//vs:PreprocessorDefinitions[contains(., 'PA_USE_DS=0')]", $namespace)
        ForEach($node in $nodes) {
          $text = $node.InnerText
          $node.InnerText = $text -replace 'PA_USE_DS=0', 'PA_USE_DS=1'
        }
        $xdoc.save($vcxprojFile)
        # Process .vcxproj.filters file: remove source files and includes
        $vcxprojFiltersFile = resolve-path("${{env.VCXPROJ_FILTERS_FILE_PATH}}")
        $xdoc.load($vcxprojFiltersFile)
        $namespace = New-Object -TypeName "Xml.XmlNamespaceManager" -ArgumentList $xdoc.NameTable
        $namespace.AddNamespace("vs", $xdoc.DocumentElement.NamespaceURI)
        $nodes = $xdoc.SelectNodes("//vs:ClCompile[contains(@Include, '..\src\hostapi\asio')]", $namespace)
        Write-Output "deleting ASIO related compilation nodes from .vcxproj.filters:"
        Write-Output $nodes
        ForEach($node in $nodes) {
          $parent = $node.ParentNode
          $parent.RemoveChild($node)
        }
        $nodes = $xdoc.SelectNodes("//vs:ClInclude[contains(@Include, 'pa_asio.h')]", $namespace)
        Write-Output "deleting ASIO related include nodes from .vcxproj.filters:"
        Write-Output $nodes
        ForEach($node in $nodes) {
          $parent = $node.ParentNode
          $parent.RemoveChild($node)
        }
        $xdoc.save($vcxprojFiltersFile)
        # Process .def file: remove PaAsio_ symbols
        Set-Content -Path "${{env.DEF_FILE_PATH}}" -Value (Get-Content -Path "${{env.DEF_FILE_PATH}}" | Select-String -Pattern 'PaAsio_' -NotMatch)

    - name: Configure Static Library with Static Runtime
      run: |
        # Modify the project file to build as static library with static runtime
        $xdoc = new-object System.Xml.XmlDocument
        $vcxprojFile = resolve-path("${{env.VCXPROJ_FILE_PATH}}")
        $xdoc.load($vcxprojFile)
        $namespace = New-Object -TypeName "Xml.XmlNamespaceManager" -ArgumentList $xdoc.NameTable
        $namespace.AddNamespace("vs", $xdoc.DocumentElement.NamespaceURI)
        
        # Change ConfigurationType to StaticLibrary
        $configTypeNodes = $xdoc.SelectNodes("//vs:ConfigurationType", $namespace)
        Write-Output "Changing ConfigurationType to StaticLibrary:"
        ForEach($node in $configTypeNodes) {
          Write-Output "Before: $($node.InnerText)"
          $node.InnerText = "StaticLibrary"
          Write-Output "After: $($node.InnerText)"
        }
        
        # Set static runtime linkage
        $runtimeNodes = $xdoc.SelectNodes("//vs:RuntimeLibrary", $namespace)
        Write-Output "Setting RuntimeLibrary to MultiThreaded for static runtime:"
        ForEach($node in $runtimeNodes) {
          Write-Output "Before: $($node.InnerText)"
          if ($node.InnerText -eq "MultiThreadedDLL") {
            $node.InnerText = "MultiThreaded"
          } elseif ($node.InnerText -eq "MultiThreadedDebugDLL") {
            $node.InnerText = "MultiThreadedDebug"
          }
          Write-Output "After: $($node.InnerText)"
        }
        
        # Remove .def file reference since we're building static lib
        $linkNodes = $xdoc.SelectNodes("//vs:Link", $namespace)
        ForEach($linkNode in $linkNodes) {
          $defFileNodes = $linkNode.SelectNodes("vs:ModuleDefinitionFile", $namespace)
          ForEach($defNode in $defFileNodes) {
            Write-Output "Removing ModuleDefinitionFile: $($defNode.InnerText)"
            $linkNode.RemoveChild($defNode)
          }
        }
        
        $xdoc.save($vcxprojFile)

    - name: Build Static Library
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m `
          /p:Configuration=${{matrix.BUILD_CONFIGURATION}} `
          /p:Platform=${{matrix.BUILD_PLATFORM}} `
          /p:ConfigurationType=StaticLibrary `
          /p:RuntimeLibrary=MultiThreaded `
          ${{env.VCXPROJ_FILE_PATH}}

    - name: Find Built Library
      id: find_lib
      run: |
        $libPath = Get-ChildItem -Path . -Recurse -Filter "portaudio.lib" | Select-Object -First 1
        if ($libPath) {
          Write-Output "Found library at: $($libPath.FullName)"
          Write-Output "LIB_PATH=$($libPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "LIB_DIR=$($libPath.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Error "portaudio.lib not found!"
          Get-ChildItem -Path . -Recurse -Filter "*.lib" | ForEach-Object { Write-Output "Found: $($_.FullName)" }
          exit 1
        }

    - name: Create Include Directory Structure
      run: |
        # Create dist directory structure
        New-Item -ItemType Directory -Path "dist\include" -Force
        # Copy all header files
        Copy-Item -Path "include\*.h" -Destination "dist\include\" -Recurse -Force
        Write-Output "Headers copied to dist/include"

    - name: Copy Library to Dist
      run: |
        # Copy the built library to dist directory
        New-Item -ItemType Directory -Path "dist\lib\x64" -Force
        Copy-Item -Path "${{env:LIB_PATH}}" -Destination "dist\lib\x64\portaudio.lib" -Force
        Write-Output "Library copied to dist/lib/x64/portaudio.lib"

    - name: Create Readme
      run: |
        $readmeContent = @"
PortAudio Static Library Build
==============================

Platform: x64
Configuration: Release
Runtime: Static VC++ Runtime

Contents:
- include/ - PortAudio header files
- lib/x64/portaudio.lib - Static library for x64

Build Info:
- Built with: Visual Studio 2022
- Runtime: Static linkage (no VC++ redistributable required)
- Date: $(Get-Date -Format "yyyy-MM-dd")
- Repository: ${{ github.repository }}

Usage:
1. Add 'dist/include' to your include path
2. Link against 'dist/lib/x64/portaudio.lib'
3. No external DLL dependencies required

Features:
- DirectSound support enabled
- ASIO support disabled (requires ASIO SDK)
- Static VC++ runtime linkage
"@
        Set-Content -Path "dist\README.txt" -Value $readmeContent

    - name: Create Zip Package
      run: |
        $version = "x64-release-static"
        $zipName = "portaudio-$version-$(Get-Date -Format 'yyyyMMdd').zip"
        Compress-Archive -Path "dist\*" -DestinationPath "$zipName" -Force
        Write-Output "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Output "Created package: $zipName"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: portaudio-static-x64
        path: ${{env.ZIP_NAME}}
        retention-days: 30

    - name: Display Package Contents
      run: |
        Write-Output "Package contents:"
        Get-ChildItem -Path "dist" -Recurse | ForEach-Object { Write-Output "  $($_.FullName)" }
        Write-Output "Zip file: ${{env.ZIP_NAME}}"

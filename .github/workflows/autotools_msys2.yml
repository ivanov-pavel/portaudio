name: Build Static PortAudio (MSYS2 MingW64 Static .lib)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_DIR: ${HOME}/portaudio-build
  ARTIFACT_NAME: portaudio-static-mingw64

jobs:
  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout PortAudio
      uses: actions/checkout@v3
      
    - name: Setup MSYS2 MingW64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git 
          mingw-w64-x86_64-gcc 
          mingw-w64-x86_64-autotools 
          autoconf-archive 
          zip

    - name: Regenerate configure scripts
      run: |
        autoreconf -fvi

    - name: Configure for static build
      run: |
        ./configure \
          --host=x86_64-w64-mingw32 \
          --enable-static \
          --disable-shared \
          --with-winapi=wasapi,wdmks,directx \
          --prefix=${{ env.BUILD_DIR }}

    - name: Build static library
      run: |
        make -j$(nproc)
        make install

    - name: Rename to .lib and verify
      run: |
        # Rename to .lib
        cp ${{ env.BUILD_DIR }}/lib/libportaudio.a ${{ env.BUILD_DIR }}/lib/portaudio.lib
        
        echo "=== Built files ==="
        ls -la ${{ env.BUILD_DIR }}/lib/
        
        echo "=== Checking static build ==="
        x86_64-w64-mingw32-objdump -p ${{ env.BUILD_DIR }}/lib/portaudio.lib | grep "DLL Name" || echo "No DLL dependencies - good!"

    - name: Create distribution archive
      run: |
        mkdir -p ${{ env.ARTIFACT_NAME }}
        cp ${{ env.BUILD_DIR }}/lib/portaudio.lib ${{ env.ARTIFACT_NAME }}/
        cp -r ${{ env.BUILD_DIR }}/include/* ${{ env.ARTIFACT_NAME }}/
        zip -r ${{ env.ARTIFACT_NAME }}.zip ${{ env.ARTIFACT_NAME }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: portaudio-static-mingw64
        path: ${{ env.ARTIFACT_NAME }}.zip
        retention-days: 30

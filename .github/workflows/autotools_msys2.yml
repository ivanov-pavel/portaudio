name: Build Static PortAudio (Windows MinGW)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_DIR: ${HOME}/portaudio-build
  ARTIFACT_NAME: portaudio-static-windows

jobs:
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout PortAudio
      uses: actions/checkout@v3
      
    - name: Setup MSYS2 and build tools
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git 
          mingw-w64-ucrt-x86_64-gcc 
          mingw-w64-ucrt-x86_64-autotools 
          autoconf-archive 
          mingw-w64-ucrt-x86_64-tools 
          zip

    - name: Regenerate configure scripts
      run: |
        autoreconf -fvi

    - name: Configure for static build
      run: |
        ./configure \
          --host=x86_64-w64-mingw32 \
          --enable-static \
          --disable-shared \
          --with-winapi=wasapi,wdmks,directx \
          --prefix=${{ env.BUILD_DIR }}

    - name: Build static library
      run: |
        make -j$(nproc)
        make install

    - name: Verify static library
      run: |
        echo "=== Checking library type ==="
        file ${{ env.BUILD_DIR }}/lib/libportaudio.a
        echo "=== Checking dependencies ==="
        x86_64-w64-mingw32-objdump -p ${{ env.BUILD_DIR }}/lib/libportaudio.a | grep "DLL Name" || echo "No DLL dependencies - good!"

    - name: Create distribution archive
      run: |
        mkdir -p ${{ env.ARTIFACT_NAME }}
        # Copy static library
        cp ${{ env.BUILD_DIR }}/lib/libportaudio.a ${{ env.ARTIFACT_NAME }}/
        # Copy headers
        cp -r ${{ env.BUILD_DIR }}/include/* ${{ env.ARTIFACT_NAME }}/
        # Create README
        cat > ${{ env.ARTIFACT_NAME }}/README.txt << EOF
        Static PortAudio Library Build
        ==============================
        
        Built with: x86_64-w64-mingw32-gcc
        Date: $(date)
        Features: Static build, no external dependencies
        
        Contents:
        - libportaudio.a: Static library
        - portaudio.h: Main header
        - Other header files
        
        Usage:
        Compile with: -static -static-libgcc -static-libstdc++ -lwinpthread
        Link with: -lportaudio -lwinmm -lole32 -lsetupapi -luuid
        EOF
        
        # Create zip archive
        zip -r ${{ env.ARTIFACT_NAME }}.zip ${{ env.ARTIFACT_NAME }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: portaudio-static-windows
        path: ${{ env.ARTIFACT_NAME }}.zip
        retention-days: 30

    - name: Test static linking
      run: |
        echo "=== Testing static compilation ==="
        cd ${{ env.BUILD_DIR }}
        # Test compile with static linking
        x86_64-w64-mingw32-gcc -static -static-libgcc -static-libstdc++ \
          -I./include \
          -o patest_init_static.exe \
          ../test/patest_init.c \
          -L./lib -lportaudio \
          -lwinmm -lole32 -lsetupapi -luuid -lwinpthread
        
        echo "=== Checking executable dependencies ==="
        x86_64-w64-mingw32-objdump -p patest_init_static.exe | grep "DLL Name" || echo "No DLL dependencies - static build successful!"
